# OpenTelemetry Collector（最小可用配置）
#
# 接收 Mnemos 通过 OTLP/HTTP 推送的 trace，批量处理后输出到 collector 日志
# （debug exporter）。本地排障时用 `docker compose logs -f otel-collector`
# 即可看到 span；生产环境应把 exporters 换成 Tempo/Jaeger/云厂商后端。
receivers:
  otlp:
    protocols:
      http:
        # 容器内监听全部网卡；宿主机通过 4318 端口映射访问。
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  debug:
    # basic 只打印摘要；detailed 打印 span 属性与事件，便于本地核对。
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
  telemetry:
    logs:
      level: info
