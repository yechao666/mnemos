# Grafana 仪表盘自动加载
apiVersion: 1

providers:
  - name: mnemos-dashboards
    orgId: 1
    folder: Mnemos
    folderUid: mnemos
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
