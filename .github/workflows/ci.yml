name: CI

# 触发：main 分支的 push 与 PR；同一分支只保留最新一次运行。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与 package.json 的 engines / packageManager 保持一致
  NODE_VERSION: '24'
  PNPM_VERSION: '10.4.0'

jobs:
  verify:
    name: 类型检查 · 测试 · 构建 · 冒烟 · 安全基线
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（server）
        run: pnpm exec tsc -p server/tsconfig.json --noEmit

      - name: 类型检查（web）
        run: pnpm exec tsc -p web/tsconfig.json --noEmit

      - name: 单元测试
        run: pnpm test

      - name: 构建（web/dist）
        run: pnpm build

      - name: 端到端冒烟（独立端口 + 临时数据目录）
        run: node scripts/smoke-api.mjs

      # security-check.mjs 是黑盒检查，需要一个可访问的服务。
      # 这里在 4380 起一个一次性实例（数据目录在 .run/ 下，不触碰 data/），
      # 让登录锁定等破坏性探测只影响临时数据库。
      - name: 启动被测服务
        run: |
          mkdir -p .run/ci-server
          MNEMOS_PORT=4380 \
          MNEMOS_HOST=127.0.0.1 \
          MNEMOS_DATA_DIR=.run/ci-server \
          MNEMOS_DEMO=1 \
          NODE_ENV=test \
            nohup node server/src/main.ts > .run/ci-server/server.log 2>&1 &
          echo $! > .run/ci-server/server.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4380/api/health >/dev/null 2>&1; then
              echo "服务已就绪"
              exit 0
            fi
            sleep 1
          done
          echo "::error::服务在 60s 内未就绪"
          tail -n 80 .run/ci-server/server.log || true
          exit 1

      - name: 安全基线检查（黑盒）
        run: node scripts/security-check.mjs

      - name: 停止被测服务
        if: always()
        run: |
          if [ -f .run/ci-server/server.pid ]; then
            kill "$(cat .run/ci-server/server.pid)" 2>/dev/null || true
          fi
          # 给优雅关闭一点时间，再兜底
          sleep 2
          pkill -f 'server/src/main.ts' 2>/dev/null || true

      - name: 上传构建产物（web/dist）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 14

      - name: 上传文档截图（如存在）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docs-screenshots
          path: docs/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            .run/
            npm-debug.log*
            pnpm-debug.log*
          if-no-files-found: ignore
          retention-days: 7

  docker:
    # Docker 构建只在 verify 通过后执行；本机没有 Docker，
    # 因此这里仅做镜像构建的语法/依赖验证，不做容器运行与健康检查（见 docs/production-readiness.md）。
    name: Docker 构建（仅语法验证）
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker build
        run: docker build -t mnemos:ci .

      # 如需在 CI 中运行容器做真实健康检查，可启用以下步骤（需镜像内 /readyz 已上线）：
      # - name: docker run + healthcheck
      #   run: |
      #     docker run -d --name mnemos-ci -p 4380:4380 -e MNEMOS_DEMO=1 mnemos:ci
      #     for _ in $(seq 1 30); do docker inspect -f '{{.State.Health.Status}}' mnemos-ci | grep -q healthy && exit 0; sleep 2; done
      #     docker logs mnemos-ci; exit 1
