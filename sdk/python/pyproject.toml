[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-sdk"
version = "2.0.0"
description = "Mnemos v6.1 官方 Python SDK：分区 + 人 + 记忆，混合检索 / 历史 / 反馈 / 简报 / 上下文"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mnemos" }]
keywords = ["mnemos", "memory", "agent", "rag", "sdk", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/mnemos-dev/mnemos"

[tool.setuptools.package-data]
mnemos = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mnemos*"]
